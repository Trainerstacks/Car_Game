<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard - Car Racing Game</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #1a1a1a;
            color: white;
            min-height: 100vh;
        }
        .navbar {
            background: #222;
        }
        .leaderboard-container {
            background: #333;
            border-radius: 10px;
            padding: 30px;
            max-width: 900px;
            margin: 50px auto;
        }
        .leaderboard-table {
            color: white;
        }
        .rank-1 { background: linear-gradient(90deg, #ffd700, #ffed4e); color: black; }
        .rank-2 { background: linear-gradient(90deg, #c0c0c0, #e8e8e8); color: black; }
        .rank-3 { background: linear-gradient(90deg, #cd7f32, #e8a76a); color: black; }
        .rank-other { background: #444; }
        .rank-cell {
            font-weight: bold;
            font-size: 1.2rem;
        }
        thead th {
            border-bottom: 3px solid #667eea;
            padding: 15px;
            text-align: left;
        }
        tbody td {
            padding: 12px 15px;
            border-bottom: 1px solid #555;
        }
        .medal {
            font-size: 1.5rem;
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand text-white fw-bold" href="/">🏎️ Car Racing Game</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="ms-auto">
                    <a href="/" class="btn btn-sm btn-primary me-2">Home</a>
                    <a href="/login" class="btn btn-sm btn-success">Login</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="leaderboard-container">
        <h1 class="text-center mb-5">🏆 Global Leaderboard</h1>

        <div class="table-responsive">
            <table class="table leaderboard-table">
                <thead>
                    <tr>
                        <th style="width: 10%;">Rank</th>
                        <th style="width: 30%;">Player</th>
                        <th style="width: 20%;">Car</th>
                        <th style="width: 20%;">Total Score</th>
                        <th style="width: 20%;">Wins</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="player, stat : ${players}" th:classappend="${stat.index == 0 ? 'rank-1' : stat.index == 1 ? 'rank-2' : stat.index == 2 ? 'rank-3' : 'rank-other'}">
                        <td class="rank-cell">
                            <span th:if="${stat.index == 0}" class="medal">🥇</span>
                            <span th:if="${stat.index == 1}" class="medal">🥈</span>
                            <span th:if="${stat.index == 2}" class="medal">🥉</span>
                            <span th:if="${stat.index > 2}" th:text="${stat.index + 1}"></span>
                        </td>
                        <td th:text="${player.username}"></td>
                        <td>
                            <span th:if="${player.carType} == 'sports'">🏎️ Sports</span>
                            <span th:if="${player.carType} == 'truck'">🚛 Truck</span>
                            <span th:if="${player.carType} == 'sedan'">🚗 Sedan</span>
                            <span th:if="${player.carType} == 'formula1'">🏁 Formula 1</span>
                        </td>
                        <td th:text="${player.totalScore}"></td>
                        <td th:text="${player.gamesWon}"></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="text-center mt-4">
            <a href="/" class="btn btn-primary me-2">Back to Home</a>
            <a href="/login" class="btn btn-success">Login to Play</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
