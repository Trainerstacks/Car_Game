# ============================================
# TrainerStacks Car Racing Game - Application Config
# ============================================

# Server Configuration
server.port=8080
server.address=0.0.0.0
server.servlet.context-path=/

# Spring Boot Application Name
spring.application.name=trainerstacks-car-game

# Database Configuration (H2 In-Memory)
spring.datasource.url=jdbc:h2:mem:cargamedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML5

# Logging Configuration
logging.level.root=INFO
logging.level.com.trainerstacks=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG

# Session Configuration
server.servlet.session.timeout=30m
spring.session.store-type=none

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Application Info
app.name=TrainerStacks Car Racing Game
app.version=1.0.0
app.description=Full-Stack Java Car Racing Game built with Spring Boot
