<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Racing Game - Play</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #222;
            color: white;
            padding: 20px;
        }
        .game-container {
            max-width: 800px;
            margin: 0 auto;
        }
        #gameCanvas {
            border: 3px solid #00ff00;
            display: block;
            margin: 20px auto;
            background: linear-gradient(180deg, #87CEEB 0%, #333 100%);
            width: 100%;
            max-width: 600px;
            height: 600px;
        }
        .game-info {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            font-weight: bold;
            font-size: 1.2rem;
        }
        .score-item {
            padding: 10px 20px;
            background: #444;
            border-radius: 5px;
        }
        .controls {
            text-align: center;
            margin: 20px 0;
            background: #333;
            padding: 20px;
            border-radius: 10px;
        }
        #gameOverModal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            color: black;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            z-index: 1000;
            text-align: center;
            min-width: 300px;
        }
        #gameOverOverlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 999;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1>🏎️ Car Racing Game</h1>
            <a href="/dashboard" class="btn btn-secondary">Back to Dashboard</a>
        </div>

        <div class="game-info">
            <div class="score-item">Score: <span id="score">0</span></div>
            <div class="score-item">Level: <span id="level">1</span></div>
            <div class="score-item">Time: <span id="timer">0</span>s</div>
            <div class="score-item">Coins: <span id="coins">0</span></div>
        </div>

        <canvas id="gameCanvas" width="600" height="600"></canvas>

        <div class="controls">
            <p style="margin-bottom: 15px; font-size: 1.1rem;">Use Arrow Keys or WASD to move your car</p>
            <button id="startBtn" class="btn btn-success btn-lg me-2">Start Game</button>
            <button id="pauseBtn" class="btn btn-warning btn-lg" disabled>Pause</button>
            <p style="margin-top: 15px; font-size: 0.9rem;">Avoid obstacles 🚧 and collect coins 💰</p>
        </div>
    </div>

    <!-- Game Over Modal -->
    <div id="gameOverOverlay"></div>
    <div id="gameOverModal">
        <h2>Game Over!</h2>
        <p>Final Score: <span id="finalScore">0</span></p>
        <p>Time Played: <span id="finalTime">0</span> seconds</p>
        <p>Coins Collected: <span id="finalCoins">0</span></p>
        <button onclick="restartGame()" class="btn btn-success me-2">Play Again</button>
        <a href="/dashboard" class="btn btn-primary">Dashboard</a>
    </div>

    <script th:inline="javascript">
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Player object
        const player = {
            x: 275,
            y: 500,
            width: 40,
            height: 50,
            speed: 5,
            velocity: 0,
            color: '#00ff00'
        };

        // Game variables
        let score = 0;
        let level = 1;
        let gameRunning = false;
        let gamePaused = false;
        let coins = 0;
        let timeElapsed = 0;
        let startTime = 0;
        let obstacles = [];
        let gameObjects = [];
        
        const keys = {};
        const playerId = [[${player.id}]];
        const difficulty = '[[${difficulty}]]' || 'easy';

        // Game config based on difficulty
        const gameConfig = {
            easy: { obstacleSpeed: 3, spawnRate: 100, speedIncrease: 0.5 },
            medium: { obstacleSpeed: 5, spawnRate: 80, speedIncrease: 0.7 },
            hard: { obstacleSpeed: 7, spawnRate: 60, speedIncrease: 0.9 },
            extreme: { obstacleSpeed: 10, spawnRate: 40, speedIncrease: 1.2 }
        };
        
        const config = gameConfig[difficulty] || gameConfig.easy;

        // Keyboard events
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if (e.key === ' ') {
                e.preventDefault();
                togglePause();
            }
        });
        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        // Button events
        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('pauseBtn').addEventListener('click', togglePause);

        function startGame() {
            gameRunning = true;
            gamePaused = false;
            score = 0;
            coins = 0;
            timeElapsed = 0;
            startTime = Date.now();
            obstacles = [];
            gameObjects = [];
            
            document.getElementById('startBtn').disabled = true;
            document.getElementById('pauseBtn').disabled = false;
            
            gameLoop();
        }

        function togglePause() {
            if (!gameRunning) return;
            gamePaused = !gamePaused;
            document.getElementById('pauseBtn').textContent = gamePaused ? 'Resume' : 'Pause';
            if (!gamePaused) gameLoop();
        }

        function drawCar() {
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.width, player.height);
            // Draw windows
            ctx.fillStyle = '#0099ff';
            ctx.fillRect(player.x + 10, player.y + 10, 20, 15);
        }

        function drawObstacle(obstacle) {
            ctx.fillStyle = '#ff0000';
            ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);
        }

        function drawCoin(coin) {
            ctx.fillStyle = '#ffff00';
            ctx.beginPath();
            ctx.arc(coin.x + coin.width/2, coin.y + coin.height/2, 8, 0, Math.PI * 2);
            ctx.fill();
        }

        function update() {
            // Move player
            if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
                player.x = Math.max(0, player.x - player.speed);
            }
            if (keys['ArrowRight'] || keys['d'] || keys['D']) {
                player.x = Math.min(canvas.width - player.width, player.x + player.speed);
            }

            // Move obstacles
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].y += config.obstacleSpeed + (level * 0.5);
                
                // Collision detection
                if (checkCollision(player, obstacles[i])) {
                    endGame(false);
                    return;
                }
                
                // Remove if off screen
                if (obstacles[i].y > canvas.height) {
                    obstacles.splice(i, 1);
                    score += 100;
                }
            }

            // Move coins
            for (let i = gameObjects.length - 1; i >= 0; i--) {
                gameObjects[i].y += config.obstacleSpeed + (level * 0.5);
                
                // Check coin collection
                if (checkCollision(player, gameObjects[i])) {
                    gameObjects.splice(i, 1);
                    coins += 1;
                    score += 50;
                } else if (gameObjects[i].y > canvas.height) {
                    gameObjects.splice(i, 1);
                }
            }

            // Update timer
            timeElapsed = Math.floor((Date.now() - startTime) / 1000);
            
            // Update level
            if (score > 0 && score % 500 === 0) {
                level = Math.floor(score / 500) + 1;
            }

            // Update UI
            document.getElementById('score').textContent = score;
            document.getElementById('level').textContent = level;
            document.getElementById('timer').textContent = timeElapsed;
            document.getElementById('coins').textContent = coins;
        }

        function draw() {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw background
            ctx.fillStyle = '#333';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw road lines
            ctx.strokeStyle = '#ffff00';
            ctx.setLineDash([20, 20]);
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);

            drawCar();
            obstacles.forEach(drawObstacle);
            gameObjects.forEach(drawCoin);
        }

        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        function spawnObstacle() {
            const width = 40;
            const height = 50;
            const x = Math.random() * (canvas.width - width);
            obstacles.push({ x, y: -height, width, height });
        }

        function spawnCoin() {
            const width = 16;
            const height = 16;
            const x = Math.random() * (canvas.width - width);
            gameObjects.push({ x, y: -height, width, height });
        }

        function gameLoop() {
            if (!gameRunning || gamePaused) return;
            
            update();
            draw();

            // Spawn obstacles
            if (Math.random() < config.spawnRate / 1000) {
                spawnObstacle();
            }
            
            // Spawn coins occasionally
            if (Math.random() < (config.spawnRate / 3000)) {
                spawnCoin();
            }

            requestAnimationFrame(gameLoop);
        }

        function endGame(won) {
            gameRunning = false;
            document.getElementById('finalScore').textContent = score;
            document.getElementById('finalTime').textContent = timeElapsed;
            document.getElementById('finalCoins').textContent = coins;
            
            // Save score to server
            fetch('/game/save-score', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: new URLSearchParams({
                    'playerId': playerId,
                    'score': score,
                    'level': level,
                    'timeSpent': timeElapsed,
                    'trackName': 'Main Track',
                    'difficulty': difficulty,
                    'won': won,
                    'obstacles': obstacles.length,
                    'coins': coins
                })
            });
            
            document.getElementById('gameOverOverlay').style.display = 'block';
            document.getElementById('gameOverModal').style.display = 'block';
            document.getElementById('startBtn').disabled = false;
            document.getElementById('pauseBtn').disabled = true;
        }

        function restartGame() {
            document.getElementById('gameOverOverlay').style.display = 'none';
            document.getElementById('gameOverModal').style.display = 'none';
            startGame();
        }

        // Auto-end after 5 minutes
        setTimeout(() => {
            if (gameRunning) {
                endGame(score > 500);
            }
        }, 300000);
    </script>
</body>
</html>
